[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usmc"
dynamic = ["version"]
description = "United Shared Memory Client - local SQLite memory for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Lukas Geiger", email = "lukas@lukisch.dev" }
]
keywords = [
    "agent-framework",
    "agent-memory",
    "ai-agent",
    "automation",
    "cross-agent",
    "cross-agent-memory",
    "llm",
    "llm-agents",
    "llm-memory",
    "local-ai",
    "local-first",
    "memory",
    "open-source",
    "prompt-context",
    "python",
    "python-cli",
    "shared-memory",
    "sqlite",
    "sqlite-memory",
    "zero-dependency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/usmc"
Repository = "https://github.com/ellmos-ai/usmc"
Issues = "https://github.com/ellmos-ai/usmc/issues"
Documentation = "https://github.com/ellmos-ai/usmc#readme"
Changelog = "https://github.com/ellmos-ai/usmc/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/usmc/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
Notice = "https://github.com/ellmos-ai/usmc/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/usmc/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://raw.githubusercontent.com/ellmos-ai/usmc/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://raw.githubusercontent.com/ellmos-ai/usmc/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/usmc/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/usmc/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/usmc/blob/main/llms.txt"
Contributing = "https://github.com/ellmos-ai/usmc/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
usmc = "usmc.cli:main"

[tool.setuptools.packages.find]
include = ["usmc*"]

[tool.setuptools.package-data]
usmc = ["memory_union.contract.json"]

[tool.setuptools.dynamic]
version = { attr = "usmc.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", ".hypothesis", ".turbo", ".nyc_output", ".tox", "__pycache__", "build", "dist"]
addopts = "-ra -v --basetemp=.pytest_temp"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
]
